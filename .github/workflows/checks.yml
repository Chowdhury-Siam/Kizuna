name: Build and publish stable
on:
  pull_request:
  push:
    branches: [main, 'feature/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish_stable:
        description: Publish a new stable version after all checks (default branch only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: version
        run: python tools/release.py >> "$GITHUB_OUTPUT"
      - id: plan
        name: Decide whether this commit can publish a stable release
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PUBLISH_REQUESTED: ${{ inputs.publish_stable }}
        shell: bash
        run: |
          publish=false
          if [[ "$GITHUB_EVENT_NAME" == push && ( "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" || "$GITHUB_REF" == refs/tags/* ) ]]; then publish=true; fi
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" && "$PUBLISH_REQUESTED" == true ]]; then publish=true; fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then test "$GITHUB_REF_NAME" = "$VERSION_TAG"; fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  protocol:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/fake_phone.py --selftest
      - run: python -m unittest discover -s tools -p 'test_*.py' -v
      - run: dotnet test server/DroidOSS.Tests -c Release --logger trx --results-directory test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
  android:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy tools package was removed from the SDK repository.
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore persistent release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        shell: bash
        run: |
          if [ -n "${KEYSTORE}${STORE_PASSWORD}${KEY_ALIAS}${KEY_PASSWORD}" ]; then
            test -n "$KEYSTORE" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
            umask 077
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            printf 'ANDROID_KEYSTORE_PATH=%s\n' "$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          elif [ "$PUBLISH" = true ]; then
            echo '::error::Stable APK signing requires ANDROID_KEYSTORE_BASE64, ANDROID_STORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. See docs/RELEASING.md.'
            exit 1
          fi
      - name: Test, lint and build release
        working-directory: androidapp3
        env:
          ANDROID_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_STORE_PASSWORD || '' }}
          ANDROID_KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          ANDROID_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleRelease "-PreleaseRepository=$RELEASE_REPOSITORY"
      - name: Stage versioned APK and verify signing
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PUBLISH: ${{ needs.version.outputs.publish }}
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            APK="dist/Kizuna-v$VERSION-android.apk"
            cp androidapp3/app/build/outputs/apk/release/app-release.apk "$APK"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          else
            test "$PUBLISH" != true
            cp androidapp3/app/build/outputs/apk/release/app-release-unsigned.apk "dist/Kizuna-v$VERSION-android-unsigned.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            androidapp3/app/build/reports
            androidapp3/app/build/test-results
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"
  android-ui:
    runs-on: ubuntu-latest
    needs: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          # The legacy tools package was removed from the SDK repository.
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          disable-animations: true
          working-directory: androidapp3
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: androidapp3/app/build/reports/androidTests
  windows:
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test server/DroidOSS.sln -c Release --logger trx --results-directory test-results
      - name: Publish Windows x64
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: dotnet publish server/DroidOSS.App/DroidOSS.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none "-p:ReleaseRepository=$env:RELEASE_REPOSITORY" -o publish
      - name: Package portable app and Windows installer
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          Rename-Item publish/DroidOSS.App.exe Kizuna.exe
          Copy-Item LICENSE publish/LICENSE
          Copy-Item README.md publish/README.md
          Copy-Item NOTICE.md publish/NOTICE.md
          Copy-Item docs publish/docs -Recurse
          "GPL-3.0-only corresponding source: https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:VERSION/Kizuna-v$env:VERSION-source.zip" | Set-Content publish/SOURCE.txt
          Copy-Item docs/third-party publish/third-party -Recurse
          Get-ChildItem "$env:USERPROFILE/.nuget/packages/microsoft.netcore.app.runtime.win-x64/*/LICENSE.TXT" | ForEach-Object { Copy-Item $_.FullName publish/third-party/dotnet-LICENSE.txt }
          Get-ChildItem "$env:USERPROFILE/.nuget/packages/microsoft.netcore.app.runtime.win-x64/*/THIRD-PARTY-NOTICES.TXT" | ForEach-Object { Copy-Item $_.FullName publish/third-party/dotnet-THIRD-PARTY-NOTICES.txt }
          New-Item dist -ItemType Directory -Force
          Compress-Archive publish/* "dist/Kizuna-v$env:VERSION-win-x64.zip"
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" "/DAppVersion=$env:VERSION" "/DPublishDir=$((Resolve-Path publish).Path)" tools/installers/kizuna.iss
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
  release:
    if: needs.version.outputs.publish == 'true'
    needs: [version, protocol, android, android-ui, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: android-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          name: windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-files
      - name: Generate source, update manifest and checksums
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          git archive --format=zip --prefix="Kizuna-v$VERSION/" HEAD > "release-files/Kizuna-v$VERSION-source.zip"
          python tools/release.py --directory release-files --repository "$RELEASE_REPOSITORY"
      - name: Publish a new stable release; never replace assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its tag and files unchanged. Increment the app version to publish another release."
            exit 0
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-parse "refs/tags/$TAG^{commit}")" = "$GITHUB_SHA" || { echo '::error::Version tag points to another commit; bump the version.'; exit 1; }
          fi
          gh release create "$TAG" release-files/* --target "$GITHUB_SHA" --title "Kizuna $TAG" --notes-file docs/RELEASE_NOTES.md --latest --prerelease=false
