name: Set up Android signing
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: android-signing-setup-${{ github.repository }}
  cancel-in-progress: false
jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate and retain the signing key once
        env:
          GH_TOKEN: ${{ secrets.ANDROID_SIGNING_SETUP_TOKEN }}
        run: python3 tools/setup_android_signing.py
      # A new workflow run reads the identity saved after this run was queued.
      - name: Start the signed stable build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref main -f publish_stable=true
      - name: Setup complete
        run: echo 'Signing setup is complete. Future builds reuse the saved identity. You may remove ANDROID_SIGNING_SETUP_TOKEN.' >> "$GITHUB_STEP_SUMMARY"
